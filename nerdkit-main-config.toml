# ==============================================================================
# NERDKIT MAIN REMOTE CONFIGURATION
# Repository: GistSwoonie / NerdKit-Config
# File:  nerdkit-main-config.toml
#
# Structure:
# - PART 1: Screen Controls (Enable/disable individual tool screens)
# - PART 2: Home Screen Master Layout (Order 1..8 & Enable/Disable sections)
# - PART 2.1 - 2.8: Home Screen Sections (Parameters + Pure Markdown)
# ==============================================================================

[config_meta]
schema_version = 2
last_updated = "2026-10-26"
config_name = "production"


# ==============================================================================
# PART 1: SCREEN CONTROLS (All 60+ Screens Grouped by Category)
# Set 'true' to enable a screen, or 'false' to hide it from navigation.
# ==============================================================================
[screens]

# --- MEASURE ---
ruler = true
edge_level = true
surface_level = true
vehicle_level = true
ar_level = true
length_by_angle = true

# --- TOOLS ---
barcode_scanner = true
nfc_scanner = true
flashlight = true
calculator = false          # Currently disabled in app
magnifier = true
atomic_time = true
world_time = true
chrono = true
interval = true

# --- NAVIGATE ---
compass = true
gnss_gps = true
gnss_details = true
altitude = true
barometer = true
gnss_sky_map = true

# --- WEATHER ---
weather = true
global_weather = true
tides = true
sun_moon_details = true
sun_tracker = true

# --- MAPS ---
map = true
elevation_map = true
terrain_viewer = true
closest_places = true
offline_maps = true

# --- TRAVEL ---
travel_hud = true
trip_log = true

# --- SKY ---
solar_system = true
sky_events = true
rocket_launches = true
satellite_viewer = true
deep_sky_viewer = true
aurora_now = true
earthquakes = true

# --- SENSORS ---
acoustic = true
light = true
emf_metal = true
color = true
music_viz = true
tone_gen = true
rt60 = true

# --- NETWORK ---
speed_test = true
wifi_active = true
wifi_all = true
wifi_log = true
mobile = true
mobile_log = true
bluetooth = true
diagnostics = true

# --- DEVICE ---
battery = true
specifications = true
internal = true
external = true
data_logger = true


# ==============================================================================
# PART 2: HOME SCREEN MASTER CONTROL (Section Order & Enable/Disable)
# Sections are rendered top-to-bottom in numerical order (1, 2, 3, 4, 5, 6, 7, 8).
# Only sections set to 'true' in [home_screen.enabled_sections] are rendered.
# ==============================================================================
[home_screen]
enabled = true
title = "NerdKit Home"

# --- Enable or Disable Home Screen Sections (true / false) ---
[home_screen.enabled_sections]
emergency_banner = false    # Part 2.1: Emergency / Service Degradation Alert
welcome_hero     = true     # Part 2.2: Main Welcome & Intro Card
upsell_pro       = true     # Part 2.3: Pro Upgrade / Discount Pitch (Free users)
tools_directory  = true     # Part 2.4: Full Collapsible Tools Menu (Measure to Sky)
featured_tools   = true     # Part 2.5: Quick-Launch Instrument List
whats_new        = true     # Part 2.6: Upcoming Upgrades & Release Notes
version_update   = false    # Part 2.7: App Version Enforcement / Update Prompt
community_links  = true     # Part 2.8: Community, Docs & Support Links

# --- Top-to-Bottom Numerical Render Order (1 = Top, 8 = Bottom) ---
[home_screen.section_order]
emergency_banner = 1
welcome_hero     = 2
upsell_pro       = 3
tools_directory  = 4
featured_tools   = 5
whats_new        = 6
version_update   = 7
community_links  = 8


# ==============================================================================
# PART 2.1: EMERGENCY / MAINTENANCE BANNER SECTION
# ==============================================================================
[home_screen.sections.emergency_banner]
id = "alert_noaa_feed_2026"
style_preset = "WARNING"                 # DEFAULT, ACCENT, PRO, WARNING, CRITICAL, INFO
dismissible = true

markup = '''
`SERVICE NOTICE`
## NOAA Weather Data Delayed
NOAA upstream feeds are currently experiencing intermittent delays. Offline weather cache remains active.
'''


# ==============================================================================
# PART 2.2: MAIN WELCOME MESSAGE SECTION
# ==============================================================================
[home_screen.sections.welcome_hero]
id = "welcome_launch_v1"
style_preset = "ACCENT"
show_only_on_first_launch = false
dismissible = true

markup = '''
# Welcome to NerdKit 'beta'
### The Ultimate Environment Multi Tool.

60+ Tools with 
- NO Adds
- No Tracking
- No Account Creation.

[See NerdKit.app for full privacy details](https://nerdkit.app/privacy)
'''


# ==============================================================================
# PART 2.3: PRO UPSELL SECTION (Free Users -> Paid Conversion)
# ==============================================================================
[home_screen.sections.upsell_pro]
id = "upsell_bundle_v1"
style_preset = "PRO"
target_audience = "FREE_USERS_ONLY"      # FREE_USERS_ONLY, ALL_USERS
max_impressions = 0                      # 0 = always show on Home Screen while enabled
min_days_between_prompts = 0

markup = '''
'50% OFF LIMITED TIME (BETA)'
## Upgrade to NerdKit Pro
### Unlock the full offline telemetry suite

Support independent development and unlock advanced instrumentation:

- High-Precision Astronomical Ephemeris & Solar Eclipses
- Full Offline Vector & Elevation Maps (No Internet Needed)
- Real-Time Satellite Orbit Propagator & Pass Predictions
- Raw GNSS NMEA 0183 File Logging & CSV Sensor Dumps
- Ad-Free, Lifetime Access with Continuous Updates

[Unlock Lifetime Pro ($9.99)](nerdkit://store/pro)
'''


# ==============================================================================
# PART 2.4: COMPLETE TOOLS DIRECTORY SECTION (Collapsible Category Menu)
# ==============================================================================
[home_screen.sections.tools_directory]
id = "tools_directory_v1"
style_preset = "DEFAULT"
dismissible = false

markup = '''
## Instruments & Sensors Directory
### Browse all 60+ tools by category
'''


# ==============================================================================
# PART 2.5: FEATURED INSTRUMENTS / QUICK LAUNCH SECTION
# ==============================================================================
[home_screen.sections.featured_tools]
id = "featured_tools_v1"
style_preset = "DEFAULT"

markup = '''
## Quick Launch Instruments
### Jump directly to key tools

- [Atomic Time](nerdkit://screen/atomic_time) - NTP Stratum-1 precision clock
- [Satellite Viewer](nerdkit://screen/satellite_viewer) - Live SGP4 orbit tracking
- [Offline Maps](nerdkit://screen/offline_maps) - Vector & terrain elevation maps
- [Surface Level](nerdkit://screen/surface_level) - 2D precision spirit bubble
'''


# ==============================================================================
# PART 2.6: UPCOMING UPGRADES & RELEASE NOTES SECTION
# ==============================================================================
[home_screen.sections.whats_new]
id = "whats_new_2026_10"
style_preset = "INFO"

markup = '''
`UPCOMING IN v1.1`
## New Instruments & Offline Radar
We are adding global offline bathymetry layers, enhanced acoustic RT60 room decay graphs, and multi-constellation GNSS sky plots.
'''


# ==============================================================================
# PART 2.7: APP VERSION ENFORCEMENT & UPDATE NOTICE SECTION
# ==============================================================================
[home_screen.sections.version_update]
id = "version_check_v1"
style_preset = "INFO"
minimum_supported_version_code = 1
latest_available_version_code = 120
force_update = false

markup = '''
`UPDATE AVAILABLE`
## New Version of NerdKit Ready
A newer release of NerdKit is available on Google Play with improved sensor calibration and bug fixes.

[Update on Google Play](https://play.google.com/store/apps/details?id=com.gistgear.nerdkit)
'''


# ==============================================================================
# PART 2.8: COMMUNITY, DOCS & SUPPORT LINKS SECTION
# ==============================================================================
[home_screen.sections.community_links]
id = "community_links_v1"
style_preset = "DEFAULT"

markup = '''
## Community & Support

- [Discord Community](https://discord.gg/nerdkit) - Join discussions & feature requests
- [Documentation](https://docs.nerdkit.app) - User guides & sensor specifications
- [Contact Support](mailto:support@gistgear.com) - Report bugs or feedback
- [Privacy Policy](https://nerdkit.app/privacy) - Zero-tracking guarantee
'''
